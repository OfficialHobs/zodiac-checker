<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zodiac Checker</title>
    <link rel="stylesheet" href="{{url_for('static', filename = 'style.css')}}">
</head>

<body>
    <main class="container">
        <div class="card">
            <div class="icon">
                ✨
            </div>
            <h1>Zodiac Checker</h1>
            <p class="subtitle">
                Discover your zodiac sign and uncover what the stars say about you.
            </p>
            <div class="form-group">
                    
            <label for="dob">Date Of Birth</label>
            <input type="date" id="dob">
            </div>

            <button class="zodiac-btn">
                Find my Zodiac
            </button>
        </div>

    </main>

</body>

</html>
